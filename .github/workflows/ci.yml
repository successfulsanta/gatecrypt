name: CI

on:
  push:
  pull_request:

jobs:
  build-test:
    strategy:
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake libssl-dev python3 ${{ matrix.compiler == 'clang' && 'clang' || 'g++' }}
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
      - name: Build (warnings as errors)
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libssl-dev python3
      - name: ASan+UBSan
        run: |
          cmake -S . -B build-asan -DCMAKE_BUILD_TYPE=Debug -DENABLE_ASAN=ON -DENABLE_UBSAN=ON -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-asan -j"$(nproc)"
          ctest --test-dir build-asan --output-on-failure
      - name: TSan
        run: |
          cmake -S . -B build-tsan -DCMAKE_BUILD_TYPE=Debug -DENABLE_TSAN=ON -DCMAKE_CXX_COMPILER=clang++
          cmake --build build-tsan -j"$(nproc)"
          ctest --test-dir build-tsan --output-on-failure -R 'Table|Ring|Verify'

  fuzz-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps
        run: sudo apt-get update && sudo apt-get install -y cmake clang libssl-dev python3
      - name: Build fuzzers
        run: cmake -S . -B build-fuzz -DBUILD_FUZZ=ON -DCMAKE_CXX_COMPILER=clang++ && cmake --build build-fuzz -j"$(nproc)"
      - name: Fuzz protocol (60s)
        run: ./build-fuzz/fuzz_protocol -max_total_time=60 -print_final_stats=1
      - name: Fuzz WAL reader (60s)
        run: ./build-fuzz/fuzz_wal -max_total_time=60 -print_final_stats=1

  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang-format
        run: sudo apt-get update && sudo apt-get install -y clang-format
      - name: Check format
        run: clang-format --version && find src tests fuzz -name '*.cc' -o -name '*.h' | xargs clang-format --dry-run --Werror
