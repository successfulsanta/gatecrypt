services:
  gatecryptd:
    build: .
    image: gatecrypt:latest
    ports:
      - "8443:8443"
      - "9090:9090"
    volumes:
      - gc-data:/data
      - ./config/gatecrypt.conf.example:/etc/gatecrypt/gatecrypt.conf:ro
    command: ["-c", "/etc/gatecrypt/gatecrypt.conf"]
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    read_only: true
    tmpfs:
      - /tmp
    restart: unless-stopped

  loadgen:
    build: .
    image: gatecrypt:latest
    entrypoint: ["/usr/local/bin/gatecrypt-loadgen", "--host", "gatecryptd", "--conns", "8", "--seconds", "30"]
    depends_on:
      - gatecryptd
    network_mode: "service:gatecryptd"
    profiles: ["load"]

volumes:
  gc-data:
